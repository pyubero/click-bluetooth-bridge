# Build the two portable executables (Windows + Linux) and publish them to a
# GitHub Release.
#
# This runs ONLY when you start it by hand: Actions tab -> "Build portable release"
# -> Run workflow. There is no push/schedule trigger, so it never runs on its own
# or on a timer -- exactly once, when you click it.
name: Build portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true
        default: v1.0.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 pins an older glibc so the Linux binary runs on more
          # laptops (a binary built on a newer glibc won't run on older distros).
          - os: ubuntu-22.04
            asset: click-bridge-linux-portable
          - os: windows-latest
            asset: click-bridge-windows-portable.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "bleak>=0.22" "protobuf>=4.25" "pynput>=1.7" pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "evdev>=1.6"; fi

      - name: Build executable
        run: pyinstaller click-bridge.spec --clean --noconfirm

      - name: Rename to portable asset name
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/click-bridge.exe "dist/${{ matrix.asset }}"
          else
            mv dist/click-bridge "dist/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: dist/*
          body: |
            Portable builds -- no installation, no Python needed. Download the file
            for your OS, put it in a folder, and run it. On first run it creates a
            `config.toml` next to itself; edit that to set your controllers.

            - **Windows:** `click-bridge-windows-portable.exe`
            - **Linux:** `click-bridge-linux-portable` (`chmod +x` first)

            Windows may show an "unknown publisher" SmartScreen prompt for an
            unsigned app -- choose "More info" -> "Run anyway".

            Linux users who want the prompt-free virtual keyboard also need the
            one-time `/dev/uinput` setup (see the README).
